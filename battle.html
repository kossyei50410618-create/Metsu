<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b19">
    <title>Metsuーバトルー</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="battle-page">
    <div class="world-grid" aria-hidden="true"></div>
    <header class="site-header shell"><a class="brand" href="index.html" aria-label="Metsu ホーム"><img src="assets/metsu-logo.svg" alt="Metsu" width="176" height="72"></a><a class="back-link" href="index.html">← ロビーに戻る</a>
    </header>
    <main class="shell battle-layout" id="battle-screen">
        <aside class="hud-panel target-profile">
            <div class="panel-heading"><span aria-hidden="true">⌖</span>
                <h2>ターゲットプロフィール</h2>
            </div>
            <div class="profile-content">
                <p class="eyebrow">今のモヤモヤ</p>
                <p id="display-text" class="battle-message"></p>
                <div class="profile-divider"></div>
            </div>
        </aside>
        <section class="arena" aria-label="モンスターバトル">
            <p class="eyebrow">モンスター出現</p>
            <h1 id="status-text" role="status">モンスターを召喚中...</h1>
            <div class="health-hud">
                <div id="hp-bar" role="progressbar" aria-label="モンスターの体力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                    <div id="hp-fill"></div>
                </div><span id="hp-value">HP: 100</span>
            </div>
            <div class="battle-monster-stage">
                <div class="summon-ring ring-back"></div><button id="monster" type="button" aria-label="モンスターを攻撃"><img id="monster-img" src="assets/monster-fallback.svg" alt="モンスター" draggable="false"></button>
                <div class="summon-ring ring-floor"></div>
            </div>
            <div id="weak-spot" hidden></div>
        </section>
        <aside class="battle-sidebar">
            <section class="hud-panel sensor-panel">
                <div class="panel-heading"><span aria-hidden="true">⌁</span>
                    <h2>センサーリンク</h2>
                </div>
                <div class="sensor-content">
                    <p id="attack-hint" class="sensor-status" role="status">パンチングボールの接続を確認中…</p>
                    <details class="sensor-help">
                        <summary>接続ガイド</summary>
                        <p>ZIG SIM と中継サーバーを接続し、パンチングボールを叩いて攻撃します。</p>
                    </details>
                </div>
            </section>
        </aside>
    </main>
    <script src="mic.js"></script>
    <script src="category.js"></script>
    <script src="monster.js"></script>
    <script src="battle.js"></script>
    <script src="script.js"></script>
    <script src="ui.js"></script>
</body>

</html>
