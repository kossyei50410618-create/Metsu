<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>マジ、ストレスMAX、ムカついて滅</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>マジ、ストレスMAX、ムカついて滅</h1>
        <p id="status-text">思考のごみ箱</p>
    </header>

    <div id="input-screen">
        <textarea id="input-text" placeholder="今、モヤモヤしていることを書いてください..."></textarea>
        <div id="input-actions">
            <button id="voice-btn">🎙 音声入力</button>
            <button id="generate-btn">モンスター生成</button>
        </div>
        <div id="mic-meter">
            <div class="mic-meter-controls">
                <button id="mic-start-btn" type="button">マイクを開始</button>
                <button id="mic-calibrate-btn" type="button" disabled>環境音を較正</button>
            </div>
            <p id="mic-status" class="category-label">マイク未接続</p>
            <div class="mic-meter-display">
                <span>音量</span>
                <div class="mic-meter-track">
                    <div id="mic-meter-fill"></div>
                </div>
                <span id="mic-meter-value">0.00</span>
            </div>
            <p id="mic-noise-floor" class="category-label">ノイズフロア: 未較正</p>
        </div>
        <div id="mic-sensitivity" style="margin-top: 8px; display: flex; align-items: center; gap: 10px;">
            <label for="mic-sensitivity-slider"
                style="font-family: 'Orbitron', sans-serif; color: #64ffda; letter-spacing: 1px; font-size: 0.9rem;">感度</label>
            <input id="mic-sensitivity-slider" type="range" min="0" max="3" step="0.1" value="1.5"
                style="width: 180px;">
            <span id="mic-sensitivity-value"
                style="font-family: 'Orbitron', sans-serif; color: #ffd700; min-width: 2.5rem; text-align: right;">1.5</span>
        </div>
        <p id="pipeline-stage" class="category-label"></p>
    </div>

    <script src="mic.js"></script>
    <script src="category.js"></script>
    <script src="monster.js"></script>
    <script src="script.js"></script>
</body>

</html>
