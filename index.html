<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b19">
    <title>Metsuーモヤモヤ討伐ロビー</title>
    <link rel="icon" href="assets/favicon.png" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body class="lobby-page">
    <a class="skip-link" href="#input-text">入力へスキップ</a>
    <div class="world-grid" aria-hidden="true"></div>
    <header class="site-header shell">
        <a class="brand" href="index.html" aria-label="Metsu ホーム"><img src="assets/metsu-logo.svg" alt="Metsu" width="176" height="72"></a>
    </header>
    <main class="shell game-main">
        <div class="lobby-heading">
            <div>
                <p class="eyebrow">STRESS BREAKER / METSU</p>
                <h1>そのモヤモヤを、<span>討伐せよ。</span></h1>
            </div>
            <p>気持ちを言葉に。モンスターを召喚。<br>パンチングボールを叩いて、モヤモヤを撃破。</p>
        </div>
        <div class="game-layout">
            <section id="input-screen" class="hud-panel input-card" aria-labelledby="input-title">
                <div class="panel-heading"><span class="panel-symbol" aria-hidden="true">▧</span>
                    <h2 id="input-title">召喚コンソール</h2><span class="panel-code">INPUT</span>
                </div>
                <div class="input-content"><label for="input-text">今、何にモヤモヤしてる？</label>
                    <textarea id="input-text" placeholder="例：上司に振り回されてばかりで、もううんざり…" aria-describedby="input-error"></textarea>
                    <div class="input-meta"><span>✎ ターゲットデータ</span><span id="character-count">0 文字</span></div>
                    <p id="input-error" class="error-message" role="alert"></p>
                    <div id="input-actions"><button id="generate-btn" class="button primary" type="button"><span>討伐開始</span><span class="button-en">BATTLE START</span><span aria-hidden="true">⟶</span></button><button id="voice-btn" class="button secondary" type="button">🎤 声で召喚する <span class="button-en">VOICE INPUT</span></button></div>
                    <p id="pipeline-stage" role="status" aria-live="polite"></p>
                    <p id="mic-status" class="mic-status" role="status" aria-live="polite"></p>
                    <details class="mic-settings" open>
                        <summary>マイク設定</summary>
                        <div id="mic-meter">
                            <div class="mic-meter-controls"><button id="mic-start-btn" type="button">マイク確認</button><button id="mic-calibrate-btn" type="button" disabled>環境音調整</button><button id="mic-stop-btn" type="button">停止</button></div>
                            <div class="mic-meter-display"><span>音量</span>
                                <div class="mic-meter-track">
                                    <div id="mic-meter-fill"></div>
                                </div><span id="mic-meter-value">0.00</span>
                            </div>
                            <div id="mic-sensitivity"><label for="mic-sensitivity-slider">感度</label><input id="mic-sensitivity-slider" type="range" min="0" max="3" step="0.1" value="0.8"><output id="mic-sensitivity-value" for="mic-sensitivity-slider">0.8</output></div>
                            <div class="mic-tone-display"><span>トーン</span><strong id="mic-tone-frequency">-- Hz</strong><strong id="mic-tone-label">音声なし</strong></div>
                            <div class="mic-tone-display"><span>抑揚</span><strong id="mic-intonation-value">0.000</strong></div>
                            <p id="mic-noise-floor" class="quiet">ノイズフロア: 未較正</p>
                        </div>
                    </details>
                </div>
            </section>
        </div>
    </main>
    <script src="audio.js"></script>
    <script src="mic.js"></script>
    <script src="category.js"></script>
    <script src="monster.js"></script>
    <script type="module" src="script.js"></script>
    <script src="ui.js"></script>
</body>

</html>
