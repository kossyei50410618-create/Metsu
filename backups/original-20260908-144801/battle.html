<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>討伐 - マジ、ストレスMAX、ムカついて滅</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="battle-screen">
        <p id="status-text">モンスターを召喚中...</p>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <p id="hp-value" class="category-label">HP: 100</p>
        <p id="display-text" class="category-label battle-message"></p>
        <p id="category-label" class="category-label"></p>
        <p id="attack-hint" class="category-label"></p>
        <div id="monster">
            <img id="monster-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="モンスター">
        </div>
        <div id="weak-spot"></div>
    </div>
    <script src="mic.js"></script>
    <script src="category.js"></script>
    <script src="monster.js"></script>
    <script src="battle.js"></script>
    <script src="script.js"></script>
</body>
</html>
